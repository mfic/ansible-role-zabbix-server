---
# Defaults. Behaviour lives here; site data comes from the consuming inventory.

# ── Images and versions ──────────────────────────────────────────────────────
# The upstream default tag `alpine-7.0-latest` FLOATS. Pin it.
# Upstream documents no alpine-vs-ubuntu tradeoff -- alpine because it is the
# default, not because a source prefers it.
zabbix_server_version: "7.0.29"
zabbix_server_image_flavour: alpine
zabbix_server_compose_ref: "7.0"          # branch of zabbix/zabbix-docker

# Render the compose file from this role rather than checking out zabbix-docker
# and `git pull`ing it -- the upstream upgrade docs warn that `git pull`
# overwrites local edits.
zabbix_server_compose_dir: /opt/zabbix
zabbix_server_data_dir: /opt/zabbix/data

# ── Persistent storage ───────────────────────────────────────────────────────
# EVERY persistent path is an explicit BIND MOUNT under zabbix_server_data_dir.
# Named volumes were rejected deliberately: they live under Docker's data-root,
# so the path holding the database is neither visible to `ls` nor checkable by
# `findmnt`, and a rebuild that loses one recreates it EMPTY and green.
#
# zabbix_server_data_dir is expected to be its OWN filesystem -- a dedicated
# disk, not a directory on root. That is what turns the pre-flight mount check
# from advisory into load-bearing: a bind that silently landed on the root
# filesystem becomes distinguishable from a correct one. Set this false only for
# a deployment that deliberately keeps the data on root, and accept that the
# guard weakens to the PG_VERSION check alone.
zabbix_server_assert_data_dir_is_mount: true

# Image facts, not site choices -- variables because an image flavour change
# moves them. The Zabbix images run as uid/gid 1997 (`zabbix`); the alpine
# postgres image runs as uid/gid 70.
zabbix_server_uid: 1997
zabbix_server_gid: 1997
zabbix_server_db_uid: 70
zabbix_server_db_gid: 70

# ── Networking ───────────────────────────────────────────────────────────────
# Agents and future proxies connect here, so it is published on all interfaces.
zabbix_server_listen_address: "0.0.0.0"

# ⚠ The frontend is bound to LOOPBACK by default. How it is reached and how
# humans authenticate is a separate decision; until one is taken, the safe
# default is a port nothing off-host can open. A consuming inventory that has
# decided (reverse proxy, tunnel, direct) overrides this.
zabbix_server_web_listen_address: "127.0.0.1"
zabbix_server_web_port: 8080

# ── Database ─────────────────────────────────────────────────────────────────
zabbix_server_db_engine: postgresql
zabbix_server_db_image: "postgres:16-alpine"
# Container names are fixed in the compose template so that operators (and the
# nightly pg_dump) can address them without going through `docker compose ps`.
# Named here as well so the role's own tasks reference the same string the
# template writes, rather than repeating a literal.
zabbix_server_db_container_name: zabbix-postgres
zabbix_server_db_name: zabbix
zabbix_server_db_user: zabbix
# No default, deliberately: a default password for a database that is about to
# hold the estate's monitoring history is worse than a failed run. The
# consuming inventory supplies it from vault or SOPS.
zabbix_server_db_password: ""

# TimescaleDB is off by default, and that default is load-bearing:
# ENABLE_TIMESCALEDB acts only at SCHEMA-CREATION time, so it cannot be switched
# on later -- adopting it after the fact means a rebuild and restore.
#
# ⚠ If you do enable it, review the compression threshold against any proxy
# buffering you rely on. TimescaleDB's own default compresses records older than
# 7 days, and Zabbix documents that late-arriving data older than the threshold
# "will be discarded". A proxy that reconnects after a long outage delivers its
# buffer straight into that window, and the backfill is silently dropped. Keep
# the threshold clear of the buffer with real margin.
zabbix_server_timescaledb: false
zabbix_server_timescaledb_compress_after_days: 14   # only meaningful if enabled

# ⚠ Upstream sets no shm_size; the documented 64 MB default is too small.
zabbix_server_db_shm_size: 256m
# ⚠ Upstream ships 1m, against an image whose own Dockerfile warns that even 90s
# may not suffice (STOPSIGNAL SIGINT = fast shutdown).
zabbix_server_db_stop_grace_period: 120s

# ── Lifecycle ────────────────────────────────────────────────────────────────
# `unless-stopped`, not `always`: both survive a reboot or a daemon restart, so
# the stack comes back on its own after a hypervisor HA restart with nobody at
# the keyboard. The difference is that `always` also restarts a container an
# operator stopped on purpose, which fights maintenance. Docker's own policy is
# the mechanism -- no systemd unit -- but it only works if the docker service
# itself is enabled, which the role verifies.
zabbix_server_restart_policy: unless-stopped

# ── Services ─────────────────────────────────────────────────────────────────
# The upstream .env_srv ships both of these TRUE, so a default install starts
# Java pollers against a gateway that does not exist and an SNMP trapper reading
# a file nobody writes. Off unless something actually needs them.
zabbix_server_enable_java_gateway: false
zabbix_server_enable_snmp_traps: false

# ── Locale and identity (upstream defaults are rarely what you want) ─────────
zabbix_server_php_tz: "Etc/UTC"                 # upstream default: Europe/Riga
zabbix_server_name: "Zabbix"                    # upstream: "Composed installation"

# ── Safety assertions — see README. Do not default these to false. ───────────
# Refuse to start the stack if a database was expected but its data directory is
# absent or empty. Guards the "green, empty Zabbix" failure.
zabbix_server_assert_db_not_empty: true
# Expect an existing DB. Set false ONLY for a genuine first build.
zabbix_server_db_expect_existing: true

# Verify via the API that the server's own host object is monitored by the
# SERVER, never a proxy. Guards a heartbeat that a proxy would keep answering.
zabbix_server_assert_monitored_by_server: true

# ── Housekeeping and retention ───────────────────────────────────────────────
# Server-managed housekeeping. Partition-based housekeeping (dropping chunks
# instead of row-by-row DELETE) is a TimescaleDB feature, and TimescaleDB is off
# above; pg_partman against Zabbix's schema is not a supported configuration.
#
# ⚠ BOTH OVERRIDES MUST STAY FALSE, and this is the correction most likely to be
# undone by someone reading the documentation quickly. The requirement that
# "Override item history period" and "Override item trend period" both be
# ENABLED for the housekeeper to delete anything is TIMESCALEDB-SPECIFIC -- it
# appears only in the TimescaleDB appendix. Generalised to plain PostgreSQL it is
# wrong: the housekeeper deletes perfectly well with them off.
#
# What OFF buys is PER-ITEM retention, which is Zabbix's native behaviour. These
# two settings are GLOBAL, so turning either one on collapses every item in the
# estate onto the single period below and silently discards any longer per-item
# retention configured on templates. Nothing errors; the data just stops being
# there.
zabbix_server_housekeeping_override_history: false
zabbix_server_housekeeping_override_trends: false

# Upstream defaults, deliberately. The documentation gives no housekeeper tuning
# formula for a given host or metric count, so changing these without a measured
# problem is guessing. Monitor instead -- see the cache note below.
zabbix_server_housekeeping_frequency: 1        # hours
zabbix_server_max_housekeeper_delete: 5000

# History dominates trends on disk by roughly 100x (90 vs 8 bytes per value), so
# short history with long trends is usually the right shape for capacity data.
# Worked example, ~4,000 items at a ~2-minute average interval: 31d of history is
# ~8 GB, while *two years* of trends is ~560 MB. Capacity forecasting reads
# trends, so be generous there and deliberate with history.
#
# 31d rather than 30d so the whole of the previous calendar month is always
# present. 730d rather than 365d because year-over-year comparison needs strictly
# more than a year of data to exist at all.
zabbix_server_history_retention: "31d"
zabbix_server_trends_retention: "730d"

# ⚠ A PER-ITEM value, not a global -- applied to template items by the consuming
# inventory, and only meaningful while both overrides above are false.
#
# Availability items (ICMP ping/loss/response time, net.tcp.service port checks,
# agent availability) are the case where hourly averaging is genuinely lossy:
# "unreachable for 40 minutes from 03:12" survives in raw history and is
# destroyed by trends, which render it as one hour at 0.67. Disk-space items are
# the opposite -- hourly min/avg/max is exactly what a growth forecast reads, so
# they gain nothing from long raw retention and cost ~100x more to keep.
#
# ⚠ Re-importing or upgrading an official Zabbix template can RESET customised
# item history periods. This is not set-and-forget; re-check after template
# updates.
zabbix_server_availability_history_retention: "365d"

# ── Caches ───────────────────────────────────────────────────────────────────
# Upstream defaults, and that is a deliberate choice rather than an omission.
# The documentation gives no cache-sizing formula for a given host or metric
# count, so raising these to fill available RAM is guessing -- and an oversized
# cache hides its own wrongness, because the real working set never becomes
# visible. Add the internal items instead and let the server say which cache is
# actually tight:
#   zabbix[process,housekeeper,avg,busy]
#   zabbix[rcache,buffer,pfree]  and the vcache / trend / history equivalents
zabbix_server_cache_sizes: {}                  # {} = ship upstream defaults

# Escape hatch for ZBX_* settings this role does not model. Rendered verbatim
# into the server's environment. Kept last so it can override anything above --
# and deliberately awkward to reach for, because a setting that matters belongs
# in a named variable with the reasoning attached, not in an opaque dict.
zabbix_server_extra_env: {}
