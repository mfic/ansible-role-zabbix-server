---
# Entry point.
#
# Order matters: guard BEFORE touching the stack. An assertion that runs after
# `docker compose up` has already lost — by then PostgreSQL has initialised, the
# server has rebuilt its schema, and every healthcheck is green against an empty
# database.

- name: Pre-flight — refuse to start against a database that would be silently recreated
  ansible.builtin.import_tasks: assert_db.yml
  tags: [zabbix, assert]

- name: Deploy the Compose stack
  ansible.builtin.import_tasks: deploy.yml
  tags: [zabbix, deploy]

- name: Install the nightly database dump
  # After deploy: the dump runs pg_dump inside the database container, over a
  # bind mount the compose file renders. Arming the timer before the stack
  # exists would schedule a job with nothing to talk to.
  ansible.builtin.import_tasks: backup.yml
  tags: [zabbix, backup]

- name: Post-flight — a heartbeat must not be answerable by a proxy
  ansible.builtin.import_tasks: assert_monitoring.yml
  tags: [zabbix, assert]
