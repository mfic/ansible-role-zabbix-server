---
# Entry point.
#
# SKELETON. The assertions below are implemented; the deployment steps are still
# to be filled in.
#
# Order matters: guard BEFORE touching the stack. An assertion that runs after
# `docker compose up` has already lost.

- name: Pre-flight — refuse to start against a database that would be silently recreated
  ansible.builtin.import_tasks: assert_db.yml
  tags: [zabbix, assert]

- name: Deploy the Compose stack
  ansible.builtin.debug:
    msg: >-
      TODO: render compose_pgsql.yaml and the .env_* override files from
      templates/, then bring the stack up. Render them -- do not check out
      zabbix-docker and git pull it, because the upstream upgrade docs warn that
      git pull overwrites local edits.
  tags: [zabbix, deploy]

- name: Post-flight — a heartbeat must not be answerable by a proxy
  ansible.builtin.import_tasks: assert_monitoring.yml
  tags: [zabbix, assert]
