---
# Pre-flight guard: refuse to start the stack against a database that is about to
# be silently recreated empty.
#
# Confirmed in the upstream source: pgsql.sh rebuilds database and schema on an
# `info` log line and exits 0. pg_isready, service_healthy,
# service_completed_successfully and the frontend /ping ALL pass afterwards, and
# an external heartbeat never fires either, because the server really is alive.
# The only symptom is that every historical metric is gone.
#
# Nothing upstream prevents this. This file is the prevention.

- name: Check whether the PostgreSQL data directory exists
  ansible.builtin.stat:
    path: "{{ zabbix_server_data_dir }}/postgresql/data/PG_VERSION"
  register: _zbx_pgdata

- name: Fail when an existing database was expected but the data directory is empty
  ansible.builtin.fail:
    msg: >-
      REFUSING TO START. {{ zabbix_server_data_dir }}/postgresql/data holds no
      PG_VERSION, so PostgreSQL would initialise a NEW, EMPTY cluster and Zabbix
      would rebuild its schema and come up green with zero history. Every
      healthcheck would pass and the dead-man's switch would stay silent.
      If this really is the first build, set zabbix_server_db_expect_existing=false
      for this run only. If it is not, STOP: the durable volume is missing or
      mounted at the wrong path, and starting the stack destroys nothing but
      hides everything.
  when:
    - zabbix_server_assert_db_not_empty | bool
    - zabbix_server_db_expect_existing | bool
    - not _zbx_pgdata.stat.exists

- name: Find the mount point backing the data directory
  # `--target` walks UP to the nearest mount point, so this answers "which
  # filesystem would a write here land on" rather than "is this path itself a
  # mount". That distinction is the whole check: a data directory that resolves
  # to / is a directory on the root filesystem wearing the right name.
  ansible.builtin.command:
    cmd: "findmnt --target {{ zabbix_server_data_dir }} --noheadings --output TARGET,SOURCE"
  register: _zbx_mount
  changed_when: false
  failed_when: false

- name: Fail when the data directory is not its own filesystem
  # This is an assertion rather than a warning, and the difference is the point.
  # A warning printed on every run is a warning nobody reads — and the thing it
  # would have caught (a dedicated disk that failed to mount, so PostgreSQL
  # writes to root instead) looks EXACTLY like a healthy deployment until the
  # disk is needed. With the data on a dedicated device, "did the mount happen"
  # is a yes/no question, so ask it as one.
  ansible.builtin.fail:
    msg: >-
      REFUSING TO START. {{ zabbix_server_data_dir }} is not its own
      filesystem — it resolves to
      "{{ _zbx_mount.stdout | trim | default('nothing', true) }}". The dedicated
      data disk is missing, unmounted, or mounted somewhere else, so PostgreSQL
      would write the estate's monitoring history to the root filesystem, where
      nothing about it looks wrong until the disk fills or the VM is rebuilt.
      Mount the data device at {{ zabbix_server_data_dir }} and re-run. If this
      deployment genuinely keeps its data on root, set
      zabbix_server_assert_data_dir_is_mount=false and accept that the
      PG_VERSION check above is then the only guard left.
  when:
    - zabbix_server_assert_data_dir_is_mount | bool
    - _zbx_mount.rc != 0 or (_zbx_mount.stdout.split() | first | default('')) != zabbix_server_data_dir
